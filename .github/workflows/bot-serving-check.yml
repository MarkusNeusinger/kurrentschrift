# Synthetic monitor for the nginx bot -> seo-proxy path.
#
# Humans get the SPA shell and never notice when the bot hop breaks: the site
# looks healthy, Plausible shows normal traffic, CI is green — and every
# crawler sees an error page. Exactly that happened to the sister project
# anyplot between 2026-06-12 and 2026-07-09: the @seo_proxy upstream TLS
# verification failed (default proxy_ssl_verify_depth 1 vs a 4-deep Let's
# Encrypt chain) and every bot UA received HTTP 502 on every page, undetected
# for ~4 weeks. This check is the alarm that was missing — adopted here with
# the prerender path (docs/reference/crawler-richtlinie.md §3).
#
# The checks target the Cloud Run ORIGIN, not https://kurrentschrift.ink:
# Cloudflare's bot management 403s GitHub-runner (datacenter) IPs — including
# UA-spoofed "Googlebot", which only passes verified-bot checks from real
# Google IPs. The origin is also exactly the layer that broke in the incident
# above; Cloudflare-edge issues are out of this monitor's reach by design.
#
# Skipping the edge is exactly what the app's origin gate refuses
# (app/origin-gate.conf.template), so every probe below carries the header the
# edge would have stamped, out of the ORIGIN_SECRET repository secret. This
# monitor is the reason that gate could not be a Host rule: it cannot spoof the
# Host either, and anything else it might present as an exception would be
# public with this repository.
#
# The expectations are DERIVED from the committed app/prerender/*.html, never
# written out here. Between #451 (which changed three page titles) and this
# rewrite the hard-coded literals had gone stale and the job sat red for three
# nights on a healthy site — an alarm nobody could trust, which is worse than
# no alarm. Deriving them turns the check into what it is meant to assert
# ("what is served == what is committed"), covers every page the moment it
# lands under app/prerender/, and can never drift on a copy change again.

name: Bot Serving Check

on:
  schedule:
    - cron: "41 6 * * *" # daily 06:41 UTC
  workflow_dispatch:

# issues: write is the alarm path. Without it the job could only go red in a
# tab nobody subscribes to — which is how the three red nights above stayed
# unnoticed. The failure step opens (or comments on) one fixed-title issue and
# the success step closes it again.
permissions:
  contents: read
  issues: write

jobs:
  bot-serving:
    runs-on: ubuntu-latest
    # 32 check calls (11 pages + 15 crawler UAs + 4 machine files + 2 human
    # controls) x (--retry 2 -> up to 3 attempts x --max-time 30) can reach
    # ~48 min worst-case, plus the retried /_health gate probe (90s) and three
    # non-retried probes (charset, trailing slash, og.png — 30s each); 57 leaves
    # room to report a clean failure rather than dying to the job timeout, which
    # reports nothing useful. Recompute this when adding checks: the ceiling is
    # check calls x 90s, plus margin. The page sweep grows with app/prerender/,
    # so a new public route adds 90s to that ceiling.
    timeout-minutes: 57
    steps:
      # The expected titles come from the committed prerender files, so the
      # repo has to be here before the first request goes out.
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Crawler UAs must get the prerendered pages
        env:
          # The header the Cloudflare Transform Rule stamps on everything it
          # proxies for kurrentschrift.ink. These checks target the Cloud Run
          # ORIGIN on purpose (see the file header: Cloudflare 403s runner IPs
          # even for a UA-spoofed Googlebot), so they skip the edge and have to
          # stamp their own — the same value the app service is given. It
          # reaches curl through the environment and this step runs without
          # `set -x`, so it is never echoed. An exception keyed on anything
          # else — a header this workflow invents, a user agent — would be
          # public with this repository, which is why the shared secret is the
          # only exception the gate can afford.
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          set -uo pipefail
          # Cloud Run origin of the kurrentschrift-app service (see header
          # comment for why not https://kurrentschrift.ink).
          ORIGIN="https://kurrentschrift-app-661695800706.europe-west4.run.app"
          GOOGLEBOT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          TWITTERBOT="Twitterbot/1.0"
          CLAUDEBOT="Mozilla/5.0 (compatible; ClaudeBot/1.0; +claudebot@anthropic.com)"
          CHATGPTUSER="Mozilla/5.0 (compatible; ChatGPT-User/1.0; +https://openai.com/bot)"
          HUMAN="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          # First line of every prerendered file (app/src/lib/seo/prerender.ts
          # PRERENDER_MARKER) — the one string that separates a prerendered
          # page from the SPA shell regardless of how the copy changes.
          MARKER='<!-- kurrentschrift.ink prerender -->'
          fail=0

          # Absent secret => no header at all. Sending an empty one instead
          # would read as a mismatch, i.e. as a half-applied rotation rather
          # than as the missing secret it is.
          HDR=()
          if [ -n "${ORIGIN_SECRET}" ]; then HDR=(-H "X-Origin-Secret: ${ORIGIN_SECRET}"); fi

          # Ask the gate before anything else. /_health is its one exempt path,
          # so it answers whatever the gate is doing, and it reports the verdict
          # for the request it was asked with — never the value. Without this,
          # an armed gate plus a missing repository secret would red all 32
          # checks below with 403s and open an incident that reads "every
          # crawler page is broken" — the wrong thing to be woken up for, and
          # the wrong thing to go looking for.
          gate=$(curl -sS --retry 2 --max-time 30 -o /dev/null -D - "${HDR[@]}" "$ORIGIN/_health" \
            | tr -d '\r' | sed -n 's/^[Xx]-[Oo]rigin-[Gg]ate: //p') || gate=""
          case "$gate" in
            ok|off-seen)
              echo "origin gate: $gate — the probes below carry the header" ;;
            off)
              echo "::warning::the origin gate is not armed AND this run sent no X-Origin-Secret. Set the ORIGIN_SECRET repository secret to the value the kurrentschrift-app service will be given, before it is armed." ;;
            missing)
              echo "::error::the origin gate is armed and this run has no ORIGIN_SECRET repository secret — every check below would be a 403. Set it to the same value as the ORIGIN_SECRET on the kurrentschrift-app Cloud Run service."
              exit 1 ;;
            mismatch)
              echo "::error::the origin gate is armed and the ORIGIN_SECRET repository secret is not the value the kurrentschrift-app service was given — a half-applied rotation. Roll the gate back, finish the rotation, arm again."
              exit 1 ;;
            *)
              # No header at all: the running revision predates the gate. That
              # is deploy lag, not a serving fault, and every check below still
              # means exactly what it always meant — so it is said out loud and
              # the run continues.
              echo "::warning::$ORIGIN/_health carries no X-Origin-Gate header, so the deployed revision predates the origin gate. Check for a pending deploy." ;;
          esac

          check() {
            local ua="$1" url="$2" expect="$3" want="${4:-200}"
            local code
            # On curl failure REPLACE the code — a failing curl can still have
            # printed a partial -w code; appending would yield e.g. "200000".
            code=$(curl -sS --retry 2 --max-time 30 "${HDR[@]}" -A "$ua" -o body.html -w '%{http_code}' "$url") || code="000"
            if [ "$code" != "$want" ]; then
              echo "::error::$url with UA '$ua' returned HTTP $code (expected $want)"
              fail=1
            elif ! grep -qF "$expect" body.html; then
              echo "::error::$url with UA '$ua' returned $want but the body is missing: $expect"
              fail=1
            else
              echo "OK: $url ($ua)"
            fi
          }

          # One fetch, two assertions: the MARKER proves the prerender hop ran
          # at all, the per-route TITLE proves the right page came back (the
          # SPA shell carries the home title on every URL, so the marker alone
          # would not separate the routes and the title alone would not
          # separate "/" from the shell).
          check_page() {
            local url="$1" title="$2" want="${3:-200}"
            local code
            code=$(curl -sS --retry 2 --max-time 30 "${HDR[@]}" -A "$GOOGLEBOT" -o body.html -w '%{http_code}' "$url") || code="000"
            if [ "$code" != "$want" ]; then
              echo "::error::$url returned HTTP $code (expected $want)"
              fail=1
            elif ! grep -qF "$MARKER" body.html; then
              echo "::error::$url returned $want but is not a prerendered page (marker missing)"
              fail=1
            elif ! grep -qF "$title" body.html; then
              echo "::error::$url served a prerendered page whose title is not the committed $title"
              fail=1
            else
              echo "OK: $url -> $title"
            fi
          }

          # Bot path, one probe per committed prerendered page. Route from the
          # file path, expected title from the file itself.
          pages=0
          while IFS= read -r file; do
            rel="${file#app/prerender/}"
            title=$(grep -o '<title>[^<]*</title>' "$file" | head -1)
            if [ -z "$title" ]; then
              echo "::error::$file carries no <title> — nothing to assert against"
              fail=1
              continue
            fi
            pages=$((pages + 1))
            if [ "$rel" = "404.html" ]; then
              # The 404 page is no route: ask for a URL that is no page and
              # require the prerendered 404 WITH status 404 — the SPA shell
              # used to answer 200 here (a soft-404).
              check_page "$ORIGIN/gibt-es-nicht" "$title" 404
              continue
            fi
            route="/${rel%.html}"
            if [ "$route" = "/index" ]; then
              route="/"
            fi
            check_page "$ORIGIN$route" "$title"
          done < <(find app/prerender -name '*.html' | sort)

          # A checkout that silently produced nothing would otherwise pass the
          # whole page sweep by checking zero pages.
          if [ "$pages" -lt 1 ]; then
            echo "::error::no prerendered pages found under app/prerender/ — the sweep asserted nothing"
            fail=1
          else
            echo "swept $pages prerendered page(s)"
          fi

          # Preview bots take the same hop; Twitterbot is the one that renders
          # the card, so probe the route it is most often pointed at.
          check "$TWITTERBOT" "$ORIGIN/quiz" "$MARKER"

          # AI assistants take the same prerendered path (nginx $is_bot). These
          # checks hit the ORIGIN, so they verify the nginx map independently of
          # whether Cloudflare's AI Crawl Control currently 403s these UAs at
          # the edge — an edge-level policy change needs no change here.
          check "$CLAUDEBOT"   "$ORIGIN/schriftkunde" "$MARKER"
          check "$CHATGPTUSER" "$ORIGIN/schriftkunde" "$MARKER"

          # User-directed fetchers: a human asked their assistant to open the
          # page. Google documents its own as generally ignoring robots.txt, so
          # the nginx map is the only control point and the only thing this
          # guards. The list mirrors anyplot's check (same map, verbatim).
          for ua in \
            "Mozilla/5.0 (compatible; Google-GeminiNotebook)" \
            "Mozilla/5.0 (compatible; Google-NotebookLM)" \
            "Mozilla/5.0 (compatible; Gemini-Deep-Research)" \
            "Mozilla/5.0 (compatible; GoogleAgent-Mariner)" \
            "meta-externalfetcher/1.1" \
            "Mozilla/5.0 (compatible; Meta-WebIndexer/1.0)" \
            "Mozilla/5.0 (compatible; MistralAI-User/1.0; +https://docs.mistral.ai/robots)" \
            "Mozilla/5.0 (compatible; MistralAI-Index/1.0; +https://docs.mistral.ai/robots)" \
            "DuckAssistBot/1.2; (+http://duckduckgo.com/duckassistbot.html)" \
            "Mozilla/5.0 (compatible; Amzn-SearchBot/1.0)" \
            "Mozilla/5.0 (compatible; Amazonbot/0.1; +https://developer.amazon.com/support/amazonbot)" \
            "Grok/1.0"
          do
            check "$ua" "$ORIGIN/schriftkunde" "$MARKER"
          done

          # The machine files must be served directly, never proxied to the
          # seo backend — including for a mapped crawler UA, which is the whole
          # point of the `location =` bypasses.
          check "$GOOGLEBOT"   "$ORIGIN/robots.txt" "User-agent: Bytespider"
          check "$GOOGLEBOT"   "$ORIGIN/llms.txt"   "# kurrentschrift.ink"
          check "$CHATGPTUSER" "$ORIGIN/llms.txt"   "# kurrentschrift.ink"
          check "$GOOGLEBOT"   "$ORIGIN/sitemap.xml" "<urlset"
          # The site card must be the FILE for a preview bot, not the proxy.
          code=$(curl -sS --max-time 30 "${HDR[@]}" -A "$TWITTERBOT" -o /dev/null -w '%{http_code} %{content_type}' "$ORIGIN/og.png") || code="000"
          case "$code" in
            "200 image/png"*) echo "OK: og.png served as image to a preview bot" ;;
            *) echo "::error::og.png for a preview bot: $code (expected 200 image/png)"; fail=1 ;;
          esac

          # llms.txt carries UTF-8 punctuation; without an explicit charset a
          # strict client decodes it as Latin-1 mojibake.
          ct=$(curl -sS --max-time 30 "${HDR[@]}" -A "$GOOGLEBOT" -o /dev/null -w '%{content_type}' "$ORIGIN/llms.txt")
          case "$ct" in
            *charset=utf-8*) echo "OK: llms.txt content-type: $ct" ;;
            *)
              echo "::error::llms.txt served without utf-8 charset: $ct"
              fail=1 ;;
          esac

          # A trailing slash must normalise to the canonical URL on THIS host,
          # relative, never an internal path, plain http or the container port.
          slash_target=$(curl -sS --max-time 30 -o /dev/null "${HDR[@]}" -A "$GOOGLEBOT" \
            -w '%{redirect_url}' "$ORIGIN/quiz/")
          case "$slash_target" in
            "")
              echo "::error::trailing slash produced no redirect — the rewrite is gone"
              fail=1 ;;
            *"/seo-proxy"*|http://*|*:8080/*)
              echo "::error::trailing-slash redirect leaks or downgrades: $slash_target"
              fail=1 ;;
            *) echo "OK: trailing slash -> $slash_target" ;;
          esac

          # Control: humans must still get the SPA shell — on the home page
          # and on a deep route.
          check "$HUMAN" "$ORIGIN/"             '<div id="root">'
          check "$HUMAN" "$ORIGIN/schriftkunde" '<div id="root">'

          exit $fail

      # The alarm. One issue with a fixed title carries the whole history of
      # this monitor: a first failure opens it, every further failure comments
      # on it (so a long outage is one thread, not one issue per night), and
      # the first green run closes it again.
      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALARM_TITLE: Bot serving check is red
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # env.ALARM_TITLE inside the jq filter, not string interpolation:
          # the title travels as data and never as jq syntax.
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.ALARM_TITLE)] | .[0].number // empty')
          if [ -n "$num" ]; then
            echo "alarm issue #$num is already open — appending this run"
            gh issue comment "$num" --body "Still red: $RUN_URL"
            exit 0
          fi
          # printf over one argument per line: a YAML block scalar cannot carry
          # unindented lines, and a leading run of spaces inside the body would
          # render as a markdown code block on the issue.
          body=$(printf '%s\n' \
            "The daily bot-serving monitor failed: $RUN_URL" \
            "" \
            "Crawlers may be getting the SPA shell or an error page while the site" \
            "looks healthy to humans — the failure mode that went unnoticed for four" \
            "weeks in the sister project (see the header of the workflow file)." \
            "" \
            "Two causes are worth separating before anything else:" \
            "" \
            '- **The serving path broke** — `app/nginx.conf` (the `$is_bot` map, the' \
            '  `@seo_proxy` upstream) or the API `/seo-proxy` route. A real incident.' \
            '- **The deployed pages are behind the repo** — the expected titles come' \
            '  from the committed `app/prerender/*.html`, so a merged copy change that' \
            '  has not been deployed yet reads as a mismatch. Check for a pending deploy.' \
            "" \
            "This issue closes itself on the next green run.")
          echo "opening the alarm issue"
          gh issue create --title "$ALARM_TITLE" --label bug --body "$body"

      - name: Stand the alarm down
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALARM_TITLE: Bot serving check is red
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.ALARM_TITLE)] | .[0].number // empty')
          if [ -n "$num" ]; then
            echo "closing alarm issue #$num"
            gh issue comment "$num" --body "Green again: $RUN_URL"
            gh issue close "$num"
          else
            echo "no open alarm issue — nothing to close"
          fi
