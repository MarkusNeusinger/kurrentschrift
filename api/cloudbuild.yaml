# Cloud Build configuration for kurrentschrift backend API.
# Pattern mirrors ~/anyplot/api/cloudbuild.yaml.
substitutions:
  _SERVICE_NAME: kurrentschrift-api
  _REGION: europe-west4
  # 512Mi, not 1Gi: measured memory use is 15 % mean and 25 % p99 of 1 GiB
  # (~254 MiB peak), so 512Mi keeps 2x headroom over p99. On a warm instance the
  # memory tier is pure standing cost — idle memory bills at the full active
  # rate while idle CPU gets a ~10x discount, so halving it removes a quarter of
  # the min-instance bill for nothing.
  _MEMORY: 512Mi
  _CPU: "1"
  # min=1 buys away MOST of the cold start, and this line has twice been more
  # confident than the measurement — so, precisely:
  #  * Duration: p50 9,447 ms / p95 12,245 ms over 30 days (not the "~3 s" this
  #    comment claimed before), of which 98 % is container start plus Python
  #    import; the DB is innocent at 0.13 s.
  #  * What min=1 fixed: the AUTOSCALING cold starts, completely — 23 in the
  #    five days before, none after.
  #  * What it did NOT fix: RECYCLE starts, when Cloud Run replaces the standing
  #    instance on its own. Two on 2026-09-01, at 16.1 s and 11.0 s. The client's
  #    retry logic is therefore still earning its keep, and any claim that the
  #    cold start is "gone" is wrong.
  #  * Since 2026-09-02 the image carries bytecode (UV_COMPILE_BYTECODE plus a
  #    compileall pass, api/Dockerfile). Measured with `-X importtime` on
  #    CPython 3.13, three runs each, importing api.main with an empty vs. a
  #    warm __pycache__: 3,081–3,230 ms without, 909–1,038 ms with — ~2.2 s off
  #    every start there is, recycles included. Measured against a local venv,
  #    not inside the image (no Docker in that session): the ratio is the
  #    finding, the absolute numbers are an upper bound.
  # Funded by dropping anyplot-app's min-instance,
  # which was 99.56 % idle on a service that boots in 0.26 s; net cost ~0.
  # max=3, not 1: with concurrency 15 a single instance queued the 16th request
  # against a 60 s timeout, and — the actual reason — min=1 with max=1 forces a
  # deploy to REPLACE the only instance instead of warming the new one beside it,
  # which is where the ~73 deploy-rollout cold starts came from. Only running
  # instances are billed, and at 12,812 requests/month a second one rarely spawns.
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "3"
  _RUNTIME_SA: "kurrentschrift-runtime@kurrentschrift.iam.gserviceaccount.com"
  # DB lives on the anyplot Cloud SQL instance; cross-project cloudsql.client
  # is granted to the runtime SA in the anyplot project.
  _CLOUDSQL_INSTANCE: "anyplot:europe-west4:anyplot-db"
  # Comma-separated allow-list for the CF Access JWT path. Browser users with a
  # valid JWT but an email not in this list get 403. Left EMPTY in the repo (as
  # in anyplot) — the real allow-list is injected at deploy time via the Cloud
  # Build trigger substitution. With this empty, the JWT/email path authorizes
  # no one and only the X-Admin-Token fallback (ADMIN_TOKEN secret) is active,
  # so an empty value never locks admin out.
  _ADMIN_ALLOWED_EMAILS: ""

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
      - "-t"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest"
      - "-f"
      - "api/Dockerfile"
      - "."
    id: "build-image"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
    id: "push-image"
    waitFor: ["build-image"]

  # Apply DB migrations BEFORE the new code serves traffic. Runs as a Cloud Run
  # Job under the runtime SA, so it reaches Cloud SQL as the kurrentschrift role
  # (which owns its tables). The job
  # image is the same one we just built, so it carries the latest alembic/
  # revisions. --wait blocks the build (and thus the deploy) on the migration's
  # success, so a failed migration never ships a schema-mismatched service.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "kurrentschrift-migrate"
      - "--image=europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
      - "--region=${_REGION}"
      - "--service-account=${_RUNTIME_SA}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest"
      - "--set-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
      - "--set-env-vars=ENVIRONMENT=production"
      - "--command=.venv/bin/alembic"
      - "--args=upgrade,head"
      - "--max-retries=0"
      - "--task-timeout=300"
      - "--execute-now"
      - "--wait"
    id: "migrate"
    waitFor: ["push-image"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_RUNTIME_SA}"
      - "--memory=${_MEMORY}"
      - "--cpu=${_CPU}"
      - "--min-instances=${_MIN_INSTANCES}"
      - "--max-instances=${_MAX_INSTANCES}"
      - "--port=8000"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
      # `--update-secrets`, NOT `--set-secrets`: the latter replaces the whole
      # binding set, so it would strip any secret attached out of band from
      # every revision this pipeline creates. ORIGIN_SECRET (api/origin_gate.py)
      # is exactly such a binding — it is attached by hand when the gate is
      # armed and removed by hand to roll back, and `--set-secrets` would have
      # silently disarmed the gate on the next deploy (Copilot review, PR #493).
      # It cannot be listed here instead: Cloud Run refuses a deploy that names
      # a secret which does not exist, which would break every build until the
      # rollout reaches step (c). The cost of `--update-secrets` is that a
      # binding dropped from this line is no longer removed automatically —
      # worth it against a gate that turns itself off.
      - "--update-secrets=DATABASE_URL=DATABASE_URL:latest,ADMIN_TOKEN=ADMIN_TOKEN:latest,CF_ACCESS_TEAM_DOMAIN=CF_ACCESS_TEAM_DOMAIN:latest,CF_ACCESS_AUD=CF_ACCESS_AUD:latest"
      - "--execution-environment=gen2"
      # ^|^ alt delimiter: ADMIN_ALLOWED_EMAILS_RAW contains @ and may contain ,
      - "--set-env-vars=^|^ENVIRONMENT=production|ADMIN_ALLOWED_EMAILS_RAW=${_ADMIN_ALLOWED_EMAILS}"
      - "--cpu-throttling"
      - "--concurrency=15"
      # Longest legitimate request is a /fit or /trace at a few seconds — 60s
      # covers cold start + compute with margin; 600s only kept slow-loris
      # style connections alive.
      - "--timeout=60"
      # Deploy WITHOUT routing traffic: the smoke step probes this revision on
      # its tag URL first, and only the promote step below shifts traffic —
      # so a bad image never serves users, not even between deploy and a
      # failing smoke. The `candidate` tag moves to each new revision, and the
      # deterministic revision suffix lets promote target EXACTLY the revision
      # this build smoked (never a concurrent build's newer one).
      # `b` prefix: Cloud Run requires the suffix to start with a lowercase
      # letter, and $BUILD_ID is a UUID that usually starts with a digit.
      - "--no-traffic"
      - "--tag=candidate"
      - "--revision-suffix=b$BUILD_ID"
    id: "deploy"
    waitFor: ["migrate"]

  # Pre-traffic smoke against the CANDIDATE revision (tag URL, serving no
  # traffic yet): a bad image that still answers /health can 500 on the real
  # render path — probe the paths the public site actually depends on, plus
  # the fail-closed write gate. Retries cover the candidate's own cold start.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        # Resolve the candidate tag's URL AND assert it still points at THIS
        # build's revision (deterministic --revision-suffix) — a concurrent
        # build re-tagging `candidate` must fail this build, not get smoked
        # on its behalf.
        read -r URL REV <<< "$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --platform=managed --format=json \
          | python3 -c "import json,sys; t=json.load(sys.stdin)['status']['traffic']; c=next(x for x in t if x.get('tag')=='candidate'); print(c['url'], c['revisionName'])")"
        test "$$REV" = "${_SERVICE_NAME}-b$BUILD_ID" || { echo "candidate tag moved to $$REV (expected ${_SERVICE_NAME}-b$BUILD_ID)"; exit 1; }
        echo "smoke against candidate $$URL ($$REV)"
        # Retry EVERY probe: a freshly deployed candidate starts cold whatever
        # _MIN_INSTANCES says, and /health doesn't touch the DB, so the first
        # /styles or /write call can still be the first real DB request of that
        # container's life and may fail transiently.
        RETRY="--retry 5 --retry-delay 5 --retry-all-errors"
        # The candidate is probed on its `run.app` tag URL, which by definition
        # never passes the Cloudflare edge — so once ORIGIN_SECRET is set on the
        # service (api/origin_gate.py) every probe but /health needs the header
        # the edge would have stamped. Read here rather than through
        # `availableSecrets` on purpose: that resolves at build start and would
        # fail every build until the secret exists, which is precisely step (a)
        # of the rollout. Missing secret or missing permission => empty => the
        # probes run bare, which is correct while the gate is off and fails
        # loudly at /styles once it is on. The value is captured, never echoed;
        # the step runs without `set -x`.
        ORIGIN_SECRET=$$(gcloud secrets versions access latest --secret=ORIGIN_SECRET 2>/dev/null || true)
        HDR=()
        if [ -n "$$ORIGIN_SECRET" ]; then HDR=(-H "X-Origin-Secret: $$ORIGIN_SECRET"); fi
        # /health stays bare: it is exempt from the gate, and that is what makes
        # it the probe that always reaches a cold candidate.
        curl -fsS $$RETRY "$$URL/health" | grep -q '"healthy"'
        # …and that it is THIS build's code. /health reports pyproject's
        # version; without the assertion the smoke passes just as happily
        # against an image that is not the one this build produced — exactly
        # what a stale or mis-tagged image looks like from outside.
        VERSION=$$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
        test -n "$$VERSION" || { echo "could not read project.version from pyproject.toml"; exit 1; }
        served=$$(curl -fsS $$RETRY "$$URL/health")
        echo "$$served" | grep -q "\"version\":\"$$VERSION\"" || { echo "candidate serves $$served, expected version $$VERSION"; exit 1; }
        # …and that the secret this BUILD can read is the one the SERVICE was
        # given. /health reports the verdict for the request it was asked with
        # (never the value), so a rotation applied to only one of the two shows
        # up here instead of as a mysterious 403 after the promote.
        # `off`/`off-seen` are ACCEPTED, not failures: they are the gate before
        # step (c) of the rollout and after a rollback, and a build that
        # refused to run then would take the deploy pipeline down exactly when
        # it is needed most. Only `mismatch` is a real disagreement.
        if [ -n "$$ORIGIN_SECRET" ]; then
          gate=$$(curl -fsS $$RETRY "$${HDR[@]}" "$$URL/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('origin_gate'))")
          case "$$gate" in
            ok) echo "origin gate: armed, and this build's secret matches" ;;
            off|off-seen) echo "origin gate: $$gate (not armed on this revision)" ;;
            *) echo "origin gate says '$$gate' for this build's secret — service and build disagree"; exit 1 ;;
          esac
        fi
        curl -fsS $$RETRY "$${HDR[@]}" "$$URL/styles" | grep -q '"id"'
        curl -fsS $$RETRY "$${HDR[@]}" "$$URL/sources/suetterlin-1922/write/word?text=lesen" | grep -q '"items"'
        # Fail-closed admin gate, probed via a body-less admin-gated GET so the
        # assertion can never race request-body validation. The key is the bare
        # `n`: positional suffixes are gone since migration 0017, and the old
        # `n-medial` passed only because the gate fires before the 404.
        code=$$(curl -s $$RETRY "$${HDR[@]}" -o /dev/null -w '%{http_code}' "$$URL/sources/suetterlin-1922/templates/n/fit")
        test "$$code" = "401" || { echo "admin gate expected 401, got $$code"; exit 1; }
        echo "smoke OK"
    id: "smoke"
    waitFor: ["deploy"]

  # Smoke passed — route 100% of traffic to EXACTLY the revision this build
  # deployed and smoked (deterministic name via --revision-suffix), never
  # `--to-latest`, which could promote a concurrent build's unsmoked revision.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--to-revisions=${_SERVICE_NAME}-b$BUILD_ID=100"
    id: "promote"
    waitFor: ["smoke"]

  # `:latest` means "the image currently serving", so it moves only after the
  # promote step. Pushed before the rollout — as it was until now — the tag
  # named an image that a failing migrate or smoke may have stopped from ever
  # serving a request, which is exactly the wrong thing to hand someone who
  # pulls `:latest` to reproduce production.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest"
    id: "push-latest"
    waitFor: ["promote"]

images:
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"
