# Security response headers for the site's nginx (audit 2026-09-02, finding 6:
# kurrentschrift.ink answered with none of them, while the sister project had
# carried its set since its own audit of 2026-07-16).
#
# Included at server level in nginx.conf AND re-included inside EVERY location
# that declares an `add_header` of its own — nginx's `add_header` does not merge
# across levels: a location with any header of its own silently drops all
# inherited ones. When a new location gets an `add_header`, re-include this file
# there too. That inheritance trap is the reason this lives in its own file
# instead of in the server block.
#
# Sister file: ~/anyplot/app/security-headers.conf — same shape and the same
# header set, deliberately NOT the same policy: the CSP names the sources of ITS
# site. What is copied is the mechanism, not the value.
#
# ---------------------------------------------------------------------------
# REPORT-ONLY FIRST, THEN ENFORCING (owner decision, 2026-09-02)
# ---------------------------------------------------------------------------
# The policy ships as `Content-Security-Policy-Report-Only` for one week. A
# report-only policy blocks nothing; it only reports, and the reports are what
# make the switch measurable instead of brave — a CSP mistake would take the
# workbench (the admin, which no automated pass can open) down.
#
# The switch is ONE word: rename the header below to `Content-Security-Policy`
# and deploy. `report-uri` stays in the enforcing policy, so violations keep
# arriving after the switch — a blocked source is worth hearing about too.
#
# The week now measures one thing more than it was set up for. Since
# 2026-09-04 `script-src` carries a per-request nonce instead of two hashes
# (below), and whether Cloudflare stamps that nonce onto the script IT injects
# is not observable from any local test — the edge has to see the header. So
# the reports are the instrument: while this stays Report-Only, a
# `script-sample` naming `window.__CF$cv$params` arriving at /csp-report would
# say the edge is NOT honouring the nonce here, and silence says it is. The
# same mechanism was verified live and enforcing on anyplot.ai first.
#
# The report channel is `report-uri` ALONE, and that is a measured decision,
# not the obvious one. The modern pairing is `report-to` plus a
# `Reporting-Endpoints` header, and the first version of this file shipped both
# — on the theory that Chromium reads the new one and Firefox/Safari the old.
# Walked in a browser on 2026-09-02, that theory cost every Chromium report:
#
#   * with `report-to` in the policy, Chromium IGNORES `report-uri` (it is
#     specified to) and delivered nothing at all — no request reached the
#     endpoint in 200 s, and none appeared in the network log either;
#   * with `report-to` removed, the same violation arrived at `report-uri`
#     in under a second.
#
# A channel that silences the working one without replacing it is worse than no
# channel, and Chromium is most of the traffic. `report-to` comes back the day
# a report is SEEN arriving through it over HTTPS — not before.
#
# The endpoint is `POST /csp-report` on the API host: it counts and logs and
# writes nothing (api/routers/csp.py). It parses the Reporting API's body shape
# as well, so the day `report-to` is added back, nothing else has to change.
#
# ---------------------------------------------------------------------------
# WHY EACH CSP SOURCE IS THERE (the actual sources of THIS site)
# ---------------------------------------------------------------------------
# default-src 'self'
#     Everything not named below — media, manifest, frames — comes from the
#     origin or does not exist.
#
# script-src 'self' + a per-request NONCE, NO 'unsafe-inline'
#     'self' covers the Vite entry module and `/js/script.js`, the Plausible
#     script proxied same-origin by the Cloudflare Worker. The nonce covers
#     app/index.html's two inline scripts: the landing hero's `/write/word`
#     preload warmer, and the Plausible stub + `plausible.init`.
#     `<script type="application/ld+json">` is a data block, not an executed
#     script, so CSP never asks about it — it is stamped anyway, because the
#     stamp is a blunt string match and a nonce on a data block is inert.
#
#     This was two sha256 HASHES until 2026-09-04, and the swap is not
#     cosmetic. A hash covers exactly the bytes it was computed over, and a
#     THIRD inline script arrives that this repository does not write:
#     Cloudflare JavaScript Detections injects one into every HTML response at
#     the edge, carrying a per-response ray id and timestamp —
#
#         window.__CF$cv$params={r:'a35dd4326fd10204',t:'MTc4ODUzMzY2MA=='};…
#
#     — so it has no hash that can ever be listed here. The sister project
#     measured that a hash-only script-src blocks exactly that one script
#     (anyplot #11213), which would have quietly degraded bot detection on a
#     Free-plan zone where JavaScript Detections cannot even be turned off
#     while Bot Fight Mode is on.
#
#     A nonce is the way out and Cloudflare's own recommendation: their
#     JavaScript Detections page says it "will add these nonces to the scripts
#     it injects by parsing your CSP response header", and it must be the
#     HEADER — the docs exclude a nonce set via a `<meta>` tag. Verified live
#     on anyplot.ai on 2026-09-04, where the same mechanism now runs enforcing:
#     the injected `<script>` carries the document's nonce, and so do BOTH
#     scripts Cloudflare creates inside its hidden iframe (`d.nonce`,
#     `a.nonce`) — the propagation gap reported by other zones does not occur.
#
#     The nonce is nginx's `$request_id`: 16 random bytes as 32 hex digits,
#     hex being inside the base64-value charset the CSP nonce grammar accepts,
#     and 16 bytes being the 128 bits of entropy CSP recommends. app/nginx.conf
#     stamps that same variable onto every `<script` tag of the shell with
#     `sub_filter`; header and tag are one variable read twice in one request,
#     and `tests/test_csp_policy.py` refuses any drift between the two halves.
#
# style-src 'self' 'unsafe-inline'
#     UNAVOIDABLE, and now for a sharper reason than "nginx cannot mint a
#     nonce" — it demonstrably can, see script-src above. It is that the theme
#     tokens ride on inline `style` ATTRIBUTES, which no nonce can ever cover
#     (only `'unsafe-hashes'` reaches them), and that Emotion (MUI's engine)
#     renders by injecting a <style> element and then mutating its sheet at
#     runtime. index.html's own two <style> blocks (the @font-face declarations
#     and the body reset) are covered by the same keyword.
#
# img-src 'self' data: blob: https://api.kurrentschrift.ink
#     'self' = og.png, the favicons, the Offenbacher specimen. `blob:` = the
#     admin's strip viewer, which fetches an image WITH the admin header and can
#     therefore only show it as an object URL
#     (sections/admin/eigenhand/StripsPanel.tsx), plus the PDF the Lesetafel
#     hands to a download link. The API host = the chart plates and crops the
#     Tafel and the quiz show (`chartUrl`, `cropUrl`).
#     `data:` is the ONE margin in this policy rather than a measured source:
#     the built bundle emits no data: URI today (grepped, not assumed), but MUI
#     can start emitting one at a version bump, and an image from a data: URI
#     cannot execute anything — SVG loaded through <img> is scriptless.
#
# font-src 'self'
#     All 18 faces are self-hosted under /fonts/ (frontend-stack.md §6
#     "Schrift-Auslieferung"). No Google Fonts, no CDN — and deliberately no
#     `data:` here, unlike img-src: the built CSS contains no `url(data:` at
#     all, and a data: font is a real parser surface for the sake of nothing.
#
# connect-src 'self' https://api.kurrentschrift.ink
#     'self' = the Plausible event endpoint `/pa/event` (same-origin through
#     the Worker — deliberately not `/api/event`, because `/api/*` is
#     Access-gated) and the admin's `/api/*` calls. The API host = every public
#     read: the public pages go straight to the open `api.` subdomain, because
#     the Access-gated apex answers an anonymous reader with a cross-origin 302
#     (global-config.ts `publicApiBase`). plausible.io itself is NOT listed:
#     both the script and the event endpoint are proxied same-origin, and the
#     report-only week is exactly the instrument that would show it if that
#     were wrong.
#
# object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'
#     The site has no <object>/<embed>, no <base>, and no <form> that submits
#     anywhere. `frame-ancestors` is the modern half of X-Frame-Options below.
#
# What is NOT here, and why: no `frame-src`/`worker-src` (the site has neither
# an iframe nor a web worker — `default-src 'self'` is their fallback), no
# Cloudflare host (Access and a managed challenge REPLACE the response at the
# edge and carry their own headers, they do not inject into ours).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Features this site never uses. Everything left unnamed keeps its default
# allow-list — notably `clipboard-write`, which defaults to 'self' and which
# the Federprobe's "Link kopieren" needs.
# `bluetooth` is deliberately NOT in the list: Chromium does not recognise the
# token and logs "Unrecognized feature: 'bluetooth'" into EVERY visitor's
# console for it (seen in the walkthrough of 2026-09-02). A denial that only
# produces a warning is worse than no denial — an unnamed feature is already
# governed by its own default, and Web Bluetooth's is `self` with a user
# gesture on a site that never calls it.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), midi=(), serial=()" always;
# 180 days, and deliberately WITHOUT includeSubDomains or preload (owner
# decision 2026-09-02, same as anyplot): `api.kurrentschrift.ink` is a sibling
# host, not a subdomain of this one, but a future subdomain that cannot do TLS
# would be locked out for half a year, and `preload` is effectively one-way.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.kurrentschrift.ink; font-src 'self'; connect-src 'self' https://api.kurrentschrift.ink; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://api.kurrentschrift.ink/csp-report" always;
