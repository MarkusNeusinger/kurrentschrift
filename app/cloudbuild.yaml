# Cloud Build configuration for kurrentschrift admin app.
# Pattern mirrors ~/anyplot/app/cloudbuild.yaml and, since the candidate chain
# below, api/cloudbuild.yaml step for step.
#
# Why this service deserves the same care as the API: it serves the public
# website AND carries the whole crawler path in app/nginx.conf (the `$is_bot`
# map, the `location =` bypasses for robots/llms/sitemap/og, the `@seo_proxy`
# upstream). That is the very file whose breakage served every bot an HTTP 502
# for four weeks in the sister project. Before the candidate chain, a typo in
# it went live unchecked and the daily monitor was the only net, a night later.
substitutions:
  _REGION: "europe-west4"
  _SERVICE_NAME: "kurrentschrift-app"
  _RUNTIME_SA: "kurrentschrift-runtime@kurrentschrift.iam.gserviceaccount.com"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID",
        "-t",
        "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest",
        "-f",
        "app/Dockerfile",
        "app",
      ]
    id: "build-image"

  # Only the build-specific tag goes up here — it is the one the deploy pulls.
  # `:latest` waits for the promote step (see push-latest at the bottom): a
  # `--all-tags` push before the rollout means `:latest` names an image that
  # may never have served a request.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
    id: "push-image"
    waitFor: ["build-image"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--service-account"
      - "${_RUNTIME_SA}"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--timeout"
      - "60"
      # min=0 keeps idle cost ~zero (cold start ~1s for nginx); max=1 caps
      # blast radius for a personal-scale project.
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "1"
      - "--port"
      - "8080"
      - "--execution-environment"
      - "gen2"
      - "--cpu-throttling"
      - "--concurrency"
      - "15"
      # Deploy WITHOUT routing traffic: the smoke step probes this revision on
      # its tag URL first, and only the promote step below shifts traffic — so
      # a broken nginx.conf never serves visitors or crawlers, not even between
      # deploy and a failing smoke. The `candidate` tag moves to each new
      # revision, and the deterministic revision suffix lets promote target
      # EXACTLY the revision this build smoked (never a concurrent build's
      # newer one). `b` prefix: Cloud Run requires the suffix to start with a
      # lowercase letter, and $BUILD_ID is a UUID that usually starts with a
      # digit.
      - "--no-traffic"
      - "--tag=candidate"
      - "--revision-suffix=b$BUILD_ID"
    id: "deploy"
    waitFor: ["push-image"]

  # Pre-traffic smoke against the CANDIDATE revision (tag URL, serving no
  # traffic yet). Both halves of the split matter and only one of them is
  # visible to a human: the SPA shell for a browser, and the prerendered page
  # for a mapped crawler UA — the `$is_bot` map plus the `@seo_proxy` upstream,
  # which is exactly the hop that can break silently.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        # Resolve the candidate tag's URL AND assert it still points at THIS
        # build's revision (deterministic --revision-suffix) — a concurrent
        # build re-tagging `candidate` must fail this build, not get smoked
        # on its behalf.
        read -r URL REV <<< "$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --platform=managed --format=json \
          | python3 -c "import json,sys; t=json.load(sys.stdin)['status']['traffic']; c=next(x for x in t if x.get('tag')=='candidate'); print(c['url'], c['revisionName'])")"
        test "$$REV" = "${_SERVICE_NAME}-b$BUILD_ID" || { echo "candidate tag moved to $$REV (expected ${_SERVICE_NAME}-b$BUILD_ID)"; exit 1; }
        echo "smoke against candidate $$URL ($$REV)"
        # Retry EVERY probe: this service runs at min-instances 0, so the
        # candidate is ALWAYS cold, and the crawler probe additionally waits on
        # the first upstream call to api.kurrentschrift.ink.
        RETRY="--retry 5 --retry-delay 5 --retry-all-errors"
        # The candidate is probed on its `run.app` tag URL, which by definition
        # never passes the Cloudflare edge — so once ORIGIN_GATE=on is set on
        # the service (app/origin-gate.conf.template) every probe but /_health
        # needs the header the edge would have stamped. Read here rather than
        # through `availableSecrets` on purpose, exactly as api/cloudbuild.yaml
        # does: that resolves at build start and would fail every build until
        # the secret exists. Missing secret or missing permission => empty =>
        # the probes run bare, which is correct while the gate is off and is
        # caught by the /_health verdict below once it is on. The value is
        # captured, never echoed; the step runs without `set -x`.
        ORIGIN_SECRET=$$(gcloud secrets versions access latest --secret=ORIGIN_SECRET 2>/dev/null || true)
        HDR=()
        if [ -n "$$ORIGIN_SECRET" ]; then HDR=(-H "X-Origin-Secret: $$ORIGIN_SECRET"); fi
        HUMAN="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
        GOOGLEBOT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
        # Ask the gate what it makes of this build BEFORE any content probe, so
        # a wired-up-wrong secret is reported as itself rather than as a
        # mystifying 403 on the home page. /_health is the gate's one exempt
        # path, so it answers whatever the gate is doing, and it reports the
        # verdict for the request it was asked with — never the value.
        # `off`/`off-seen` are ACCEPTED, not failures: they are the gate before
        # it is armed and after a rollback, and a build that refused to run then
        # would break the deploy pipeline exactly when it is needed most. An
        # ABSENT header is a failure of its own: it means the templated maps
        # never rendered, which is the one way this mechanism can fail quietly.
        #
        # Fetched to a file rather than piped: `-ceu` carries no `pipefail`, so
        # a curl that never reached the candidate at all would leave `$$gate`
        # empty and be reported below as a config that failed to render — a
        # wrong answer, on the log someone reads while a deploy is blocked.
        curl -fsS $$RETRY "$${HDR[@]}" -o /dev/null -D gate.out "$$URL/_health" \
          || { echo "the candidate never answered /_health"; exit 1; }
        gate=$$(tr -d '\r' < gate.out | sed -n 's/^[Xx]-[Oo]rigin-[Gg]ate: //p')
        case "$$gate" in
          ok|off|off-seen) echo "origin gate: $$gate" ;;
          missing) echo "the candidate's gate is armed and this build sent no secret — every probe below would be a 403"; exit 1 ;;
          mismatch) echo "the candidate's gate is armed and this build's secret is not the one it was given"; exit 1 ;;
          *) echo "/_health carries no X-Origin-Gate header ('$$gate') — the templated origin-gate maps did not render"; exit 1 ;;
        esac
        # Humans get the SPA shell.
        curl -fsS $$RETRY "$${HDR[@]}" -A "$$HUMAN" "$$URL/" | grep -q '<div id="root">'
        # …and every <script> tag in that shell carries the CSP nonce from its
        # own response header. The two halves are one `$$request_id` read twice
        # — `add_header` in security-headers.conf, `sub_filter` in nginx.conf —
        # and the static tests can only prove the config TEXT agrees, never that
        # the built image's response does. Losing the stamp leaves a page that
        # passes every probe above and runs no inline script at all — since the
        # policy went enforcing on 2026-09-05, that is a live page, not a
        # someday. Ported from
        # the sibling (anyplot #11220) with its two corrections already in:
        #
        #   --compressed, because plain curl sends no Accept-Encoding and a
        #   precompressed shell would sail past the check while every browser
        #   got the untouched file; and the 32-hex-digit match, because
        #   `nonce-[0-9a-f]*` accepts a bare `nonce-` that `test -n` calls
        #   non-empty, so an empty nonce would agree with `nonce=""` tags all
        #   the way through.
        curl -fsS $$RETRY "$${HDR[@]}" --compressed -A "$$HUMAN" -D head.out -o body.out "$$URL/" \
          || { echo "candidate did not serve the shell for the nonce probe"; exit 1; }
        NONCE=$$(grep -i '^content-security-policy' head.out | grep -oE 'nonce-[0-9a-f]{32}' | head -1)
        test -n "$$NONCE" || { echo "the shell's CSP carries no 32-hex-digit nonce"; exit 1; }
        TAGS=$$(grep -o '<script[^>]*>' body.out | wc -l)
        MATCHING=$$(grep -o "<script nonce=\"$${NONCE#nonce-}\"" body.out | wc -l)
        test "$$TAGS" -gt 0 || { echo "the shell served no <script> tag at all"; exit 1; }
        test "$$MATCHING" = "$$TAGS" \
          || { echo "$$MATCHING of $$TAGS <script> tag(s) carry the header's $$NONCE — the rest would be blocked once enforcing"; exit 1; }
        echo "OK: all $$TAGS script tags of the shell carry the header's nonce"
        # Crawlers get the prerendered page through @seo_proxy. The marker is
        # the one string that separates it from the shell.
        curl -fsS $$RETRY "$${HDR[@]}" -A "$$GOOGLEBOT" "$$URL/" | grep -q '<!-- kurrentschrift.ink prerender -->'
        # The machine files must come from the `location =` bypasses, not the
        # proxy — and llms.txt carries UTF-8 punctuation that needs the charset.
        curl -fsS $$RETRY "$${HDR[@]}" -A "$$GOOGLEBOT" "$$URL/robots.txt" | grep -q 'User-agent: Bytespider'
        ct=$$(curl -fsS $$RETRY "$${HDR[@]}" -A "$$GOOGLEBOT" -o /dev/null -w '%{content_type}' "$$URL/llms.txt")
        case "$$ct" in
          *charset=utf-8*) ;;
          *) echo "llms.txt served as '$$ct' (expected a utf-8 charset)"; exit 1 ;;
        esac
        echo "smoke OK"
    id: "smoke"
    waitFor: ["deploy"]

  # Smoke passed — route 100% of traffic to EXACTLY the revision this build
  # deployed and smoked (deterministic name via --revision-suffix), never
  # `--to-latest`, which could promote a concurrent build's unsmoked revision.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--to-revisions=${_SERVICE_NAME}-b$BUILD_ID=100"
    id: "promote"
    waitFor: ["smoke"]

  # `:latest` means "the image currently serving", so it moves only after the
  # promote step.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest"
    id: "push-latest"
    waitFor: ["promote"]

images:
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:$BUILD_ID"
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/kurrentschrift/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY

# The chain is now deploy -> smoke (cold start + a first upstream call) ->
# promote; the default 10 min left no room for a retrying probe.
timeout: "1200s"
