# SPA-friendly nginx config for the kurrentschrift admin frontend.
#
# `/api/*` routing is handled by the Cloudflare Worker in front of this
# service (kurrentschrift.ink/api/* → api.kurrentschrift.ink), so nginx
# only serves the static React build and falls back to index.html for
# client-side routes. Requests hitting `*.run.app/api/*` directly bypass
# the Worker and get a 404 here — which is fine, they shouldn't be making
# them.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap container health probe (used by Cloud Run startup checks).
    location = /_health {
        access_log off;
        return 200 "ok\n";
    }

    # Retired public URL: /lehrbuch became /schriftkunde. The SPA keeps a
    # client-side <Navigate> as belt-and-braces, but only a real 301 gives
    # crawlers without JS the redirect signal (and carries the old URL's links).
    location = /lehrbuch {
        return 301 /schriftkunde;
    }

    # Hashed build assets never change under their name — cache hard.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts live under UNHASHED names (public/fonts/), so a swapped
    # file would not punch through an `immutable` cache — 30 days, no more. A
    # real font update versions the FILENAME (and index.html with it).
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The Schriftkunde Markdown mirror (generated at build time from the
    # locale). Three deliberate headers: (1) .md is not reliably in nginx's
    # mime.types — without a type it downloads as octet-stream instead of
    # displaying; (2) nginx sends no charset by default and the file carries
    # ſ, n̄, ₰, ℳ — Latin-1 guessing would mangle them; (3) a Markdown file has
    # no <head>, so its canonical to the HTML page can only travel as an HTTP
    # Link header (keeps /schriftkunde the indexed page without noindexing the
    # mirror away from the AI search agents it exists for).
    location = /schriftkunde.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Link '<https://kurrentschrift.ink/schriftkunde>; rel="canonical"' always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
