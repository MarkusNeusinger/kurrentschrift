# nginx for the kurrentschrift site (public SPA + admin) on Cloud Run.
#
# `/api/*` routing is handled by the Cloudflare Worker in front of this
# service (kurrentschrift.ink/api/* → api.kurrentschrift.ink), so nginx
# only serves the static React build and falls back to index.html for
# client-side routes. Requests hitting `*.run.app/api/*` directly bypass
# the Worker and get a 404 here — which is fine, they shouldn't be making
# them.
#
# Crawler path: a mapped crawler user agent is proxied to the API's
# `/seo-proxy/{route}` and gets the page PRERENDERED at build time from the
# locale catalogue (app/src/lib/seo/prerender.ts → app/prerender/, shipped in
# the API image); humans get the SPA at the same URL. The `$is_bot` map is
# shared VERBATIM with the sister project anyplot
# (~/projects/anyplot/app/nginx.conf) — a change is made in both files in the
# same breath, never in one (owner decision 2026-08-28). Doctrine:
# docs/reference/crawler-richtlinie.md §3; the daily alarm for this path:
# .github/workflows/bot-serving-check.yml.

# The map below — entries AND comments — is anyplot's block byte for byte, so
# `diff` between the two files stays empty and a change can be carried over
# by copying the whole block. Its comments therefore speak of anyplot (the
# ~3000-page catalogue, its audits, its `docs/reference/seo.md`); the
# doctrine for THIS site is docs/reference/crawler-richtlinie.md §3 and the
# proxy target is api.kurrentschrift.ink (the `@seo_proxy` location further
# down). Do not "fix" the block's prose here — change it in anyplot and copy.
#
# Bot detection for SEO — these bots get pre-rendered HTML with og:tags from
# /seo-proxy/, social bots (no JS) and search-engine bots alike. Google
# explicitly says serving prerendered HTML to crawlers is fine as long as the
# content matches what humans see; for a content-driven catalogue with ~3000
# spec/impl pages, having every URL claim the homepage's title/canonical/og:url
# (the SPA shell) costs weeks of indexing latency on new pages and risks the
# wrong title/description being indexed when client-side rendering fails.
map $http_user_agent $is_bot {
    default 0;
    # Search engines — historically excluded "because they render JS since 2019",
    # but in practice the prerendered HTML produces faster, more reliable
    # indexing for a content-driven catalogue. This path is invisible to human
    # traffic, so it is monitored continuously by
    # .github/workflows/bot-serving-check.yml (daily curl with bot UAs); after
    # any change here, also verify manually with
    # `curl -A "Googlebot" https://anyplot.ai/scatter-basic` — should return
    # the per-route title/canonical/og:url, not the empty SPA shell.
    ~*googlebot 1;
    # Search Console's URL inspection (Google-InspectionTool) and Google's
    # misc crawler (GoogleOther) do NOT contain "googlebot" in their UA —
    # without these entries they fell through to the SPA shell, so URL
    # inspection showed the wrong page (audit 2026-07-16).
    ~*google-inspectiontool 1;
    ~*googleother 1;
    ~*bingbot 1;
    ~*duckduckbot 1;
    ~*yandexbot 1;
    ~*baiduspider 1;
    ~*applebot 1;
    # AI assistants, AI search and citation crawlers. Same failure mode as the
    # search engines: none of them execute JavaScript, so without these entries
    # an AI answer citing anyplot describes the empty SPA shell. Claude-User /
    # ChatGPT-User / Perplexity-User are USER-directed fetches — a human asked
    # their assistant to open the page — and matter most.
    # This map only decides WHAT a crawler gets once it arrives, never whether
    # it may: the allow/deny policy is robots.txt plus the Cloudflare AI Crawl
    # Control zone setting (docs/reference/seo.md). Under the current policy
    # everything except Bytespider may crawl, so an agent missing from this map
    # is not thereby declined — it just gets the empty SPA shell, which is the
    # failure this list exists to prevent.
    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;
    ~*gptbot 1;
    ~*oai-searchbot 1;
    ~*chatgpt-user 1;
    ~*perplexitybot 1;
    ~*perplexity-user 1;
    # User-directed fetchers that arrive when a human asks their assistant to
    # open a page. Google documents its own as "generally ignoring robots.txt"
    # (developers.google.com/search/docs/crawling-indexing/google-user-triggered-fetchers),
    # so robots.txt cannot govern what they fetch — leaving this map to decide
    # what they receive, and Cloudflare AI Crawl Control as the only lever that
    # can still refuse them outright at the edge. Every one of these was
    # verified live on 2026-08-18 receiving the empty SPA shell, i.e. an
    # assistant asked about a plot page could describe nothing at all.
    ~*gemininotebook 1;
    ~*notebooklm 1;
    ~*gemini-deep-research 1;
    ~*googleagent 1;
    ~*google-agent 1;
    ~*meta-externalfetcher 1;
    ~*meta-webindexer 1;
    ~*mistralai-user 1;
    ~*mistralai-index 1;
    ~*duckassistbot 1;
    ~*amzn-searchbot 1;
    ~*amzn-user 1;
    # Amazon's documented crawler token is "Amazonbot" — the two amzn-* entries
    # above never matched it, so the documented crawler got the empty shell
    # (AI-access audit 2026-08-19). Same for Meta: "meta-externalagent" is the
    # documented AI-training crawler, distinct from meta-externalfetcher.
    ~*amazonbot 1;
    ~*meta-externalagent 1;
    # Community-reported assistants: no vendor documentation exists for these
    # tokens, so they are best-effort. Mapping them is harmless — this map only
    # decides WHAT an agent receives, never whether it may crawl; that is
    # robots.txt plus Cloudflare. Under-mapping is the failure mode that put
    # seven fetchers on the empty shell, so err toward listing.
    #
    # ~*grok subsumes the previously listed grokbot / xai-grok /
    # grok-deepsearch AND the bare "Grok" token xAI's fetcher was seen sending
    # — which fell through to the empty shell and produced Grok's
    # "insufficient relevant content" (AI-access audit 2026-08-19). No common
    # browser UA contains the substring.
    ~*grok 1;
    # xAI's company token, for fetcher UAs that carry "xAI" but not "grok"
    # (verified 2026-08-28: a UA "xAI-Bot" fell through ~*grok to the empty
    # shell). No common browser UA contains the substring.
    ~*xai 1;
    ~*youbot 1;
    ~*cohere-ai 1;
    ~*diffbot 1;
    ~*firecrawl 1;
    # Social Media
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*linkedinbot 1;
    ~*pinterestbot 1;
    ~*redditbot 1;
    ~*tumblr 1;
    ~*mastodon 1;
    # Messaging Apps
    ~*slackbot 1;
    ~*discordbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*signal 1;
    ~*viber 1;
    ~*skypeuripreview 1;
    ~*microsoft\ teams 1;
    ~*snapchat 1;
    # Link Preview Services
    ~*embedly 1;
    ~*quora\ link\ preview 1;
    ~*outbrain 1;
    ~*rogerbot 1;
    ~*showyoubot 1;
}

server {
    listen 8080;
    server_name _;

    # Dynamic upstream resolution for the crawler proxy — a variable in
    # proxy_pass is resolved at request time, so a not-yet-resolvable API host
    # cannot crash the container at startup (same as anyplot).
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Declare UTF-8 on text responses. llms.txt and robots.txt carry UTF-8
    # punctuation (em dashes, ſ) but were served as bare `text/plain` — a
    # strict client may decode them as Latin-1 mojibake. Applies to nginx's
    # default charset_types (text/html, text/plain, ...); responses that
    # already declare a charset (the proxied crawler pages) keep theirs.
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap container health probe (used by Cloud Run startup checks).
    location = /_health {
        access_log off;
        return 200 "ok\n";
    }

    # Retired public URL: /lehrbuch became /schriftkunde. The SPA keeps a
    # client-side <Navigate> as belt-and-braces, but only a real 301 gives
    # crawlers without JS the redirect signal (and carries the old URL's links).
    location = /lehrbuch {
        return 301 /schriftkunde;
    }

    # The machine files are served DIRECTLY — their consumers ARE the mapped
    # crawlers, so without these exact matches a crawler UA would be proxied to
    # /seo-proxy/robots.txt (404) instead of getting the file.
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /llms.txt {
        try_files $uri =404;
    }
    # llms.txt has no registered .well-known name, but agents guess this path
    # (crawler-richtlinie.md §3 "Auffindbarkeit") — answer with the file's
    # canonical location instead of a 404.
    location = /.well-known/llms.txt {
        return 302 /llms.txt;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }

    # Hashed build assets never change under their name — cache hard.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts live under UNHASHED names (public/fonts/), so a swapped
    # file would not punch through an `immutable` cache — 30 days, no more. A
    # real font update versions the FILENAME (and index.html with it).
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Stable-named static files from /public (og.png, favicon.ico, the
    # apple-touch-icon, manifest …). A regex location outranks `location /`,
    # so a crawler fetching the site card or the favicon gets the FILE, never
    # the bot proxy — without this a link preview's og:image request landed on
    # /seo-proxy/og.png. A missing file is a plain 404, not the SPA shell.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|xml|txt|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Trailing slashes are not canonical: /quiz/ and /quiz are the same page,
    # and only the second appears in the sitemap and in the page's own
    # canonical tag. Left alone, a crawler asking for the slashed form would be
    # proxied to the seo-proxy, match no page there and get the 404 — or, in
    # anyplot's case, a redirect chain that leaked the internal API host over
    # plain http. `/` itself cannot match: after `^/` there is nothing left for
    # `/$`.
    #
    # absolute_redirect off is load-bearing, not tidiness: nginx builds the
    # Location of a `permanent` rewrite from $scheme://$host:$server_port, and
    # behind Cloud Run that is http and port 8080 — a relative Location is
    # resolved by the client against the URL it actually requested, which is
    # the only value guaranteed correct here.
    absolute_redirect off;
    rewrite ^/(.*)/$ /$1 permanent;

    # Named location for the crawler proxy. The prerendered pages live in the
    # API image (api/routers/seo.py serves app/prerender/*.html), reached over
    # the public API host so the same TLS path the browsers use is the one
    # crawlers use.
    location @seo_proxy {
        set $seo_backend https://api.kurrentschrift.ink;
        proxy_pass $seo_backend/seo-proxy$request_uri;
        proxy_set_header Host api.kurrentschrift.ink;
        # Without this the upstream sees a plain-http request and any redirect
        # it generates is emitted as http://, downgrading the crawler's next
        # hop.
        proxy_set_header X-Forwarded-Proto https;
        # The CRAWLER's address must reach the API: it reports each read to
        # the bot Plausible site with the visitor IP, and Plausible drops
        # events whose forwarded IP is a hosting-provider address — verified
        # 2026-08-28 with probe events (34.90.x / 35.204.x dropped, a home IP
        # kept). Without this line the API only ever sees this container's
        # Google egress IP and nearly every crawler read vanishes. Cloudflare
        # already put the crawler first in X-Forwarded-For at the edge;
        # $proxy_add_x_forwarded_for appends our hop instead of replacing it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # Verify depth 4 covers a 4-deep Let's Encrypt chain; nginx's default
        # of 1 rejected anyplot's (SSL error 20) and every crawler got a 502
        # for four weeks — the incident the bot-serving check exists for.
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # SPA routing — serve index.html for all routes; mapped crawlers are
    # redirected to the prerender proxy via the error_page trick (the
    # nginx-safe way to branch on a map inside a location).
    location / {
        error_page 418 = @seo_proxy;
        if ($is_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
}
