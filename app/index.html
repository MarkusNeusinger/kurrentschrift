<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7dabf" />
    <!-- The paper identity is a deliberate single light scheme; without this
         declaration, forced-dark browsers invert form fields and scrollbars
         against it. -->
    <meta name="color-scheme" content="light" />
    <!-- The public data pages (Tafel, Quiz, Federprobe, Schriftkunde) and the
         landing hero all fetch from the open api. subdomain in production —
         warming DNS+TLS here saves that handshake from the critical path. -->
    <link rel="preconnect" href="https://api.kurrentschrift.ink" crossorigin="use-credentials" />

    <!-- Fonts, self-hosted (verbatim woff2 copies from @fontsource v5.3.0,
         subsets latin + latin-ext; provenance and licenses:
         THIRD_PARTY_NOTICES.md, OFL texts alongside the files in /fonts/).
         Declared HERE, not in the bundle: @font-face only fetches when a
         matching glyph hits layout, and #root is empty until the entry chunk
         has run — so the preloads below are the one layout-independent start
         signal, and the early declarations give them a stable URL to match.
         Preload ONLY the two faces that carry the above-the-fold mass
         (headline + body regular) — an A/B under Fast-3G showed every further
         preload costs the entry chunk more than it buys (the early-declared
         remaining faces fetch at first layout anyway).
         `crossorigin` is mandatory even same-origin: font fetches
         always run in CORS mode, and a mode mismatch double-downloads.
         latin-ext carries its unicode-range and loads only when a ſ (or other
         extended glyph) appears (/schriftkunde, /federprobe). A new Garamond/
         Playfair cut needs a file in public/fonts/ plus a rule here — a
         @fontsource import no longer ships it. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/playfair-display-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/eb-garamond-latin-400-normal.woff2" />

         React mounts. Not preloaded: GLKurrent is the hero's failure fallback
         plus the CategoryHeading initial (below the fold), Suetterlin only
         /schriftkunde. The TTF stays a TTF — the Zinken freeware licence
         permits redistribution but not modification (THIRD_PARTY_NOTICES.md). */

    <meta name="description" content="Alte deutsche Schreibschrift lesen und schreiben lernen — Kurrent, Sütterlin, Offenbacher: mit Quiz, Schreibtafel, Übungsblatt und einer Feder, die live schreibt." />
    <title>kurrentschrift.ink — deutsche Kurrent &amp; Sütterlin lesen und schreiben</title>

    <!-- Brand icons: the viridian Kurrent K (GLKurrent face) on the paper
         gradient — same motif as CategoryHeading. Multi-size ICO answers the
         default /favicon.ico request; the 180px PNG covers "add to home screen". -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Static SEO defaults (home / no-JS crawlers). usePageMeta overrides
         title, description, canonical and the og/twitter title+description+url
         per route at runtime. og:image stays absolute and route-independent so
         link previews (which never run JS) always get the card. -->
    <link rel="canonical" href="https://kurrentschrift.ink/" />

    <meta property="og:site_name" content="kurrentschrift.ink" />

    <!-- Structured data: one static, minimal WebSite node with the site owner
         as Person (publisher/author). Route-independent facts only — per-page
         meta stays with usePageMeta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "kurrentschrift.ink",
        "url": "https://kurrentschrift.ink/",
        "inLanguage": "de",
        "description": "Alte deutsche Schreibschrift lesen und schreiben lernen — Kurrent, Sütterlin, Offenbacher: mit Quiz, Schreibtafel, Übungsblatt und einer Feder, die live schreibt.",
        "publisher": { "@type": "Person", "name": "Markus Neusinger" },
        "author": { "@type": "Person", "name": "Markus Neusinger" }
      }
    </script>
    <!-- `touch-action: manipulation` on the body only drops the double-tap
         zoom delay; it does not block panning/scrolling. Stylus capture is
         protected where it matters — the drawing surfaces set their own
         `touch-action: none`. We deliberately do NOT set
         `overscroll-behavior: none` on the root: that would also kill the
         native pull-to-refresh gesture on mobile, and the per-canvas guard
         already covers pen events. -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body { touch-action: manipulation; }
    </style>

    <!-- Warm the landing hero's composition in parallel with the JS bundle:
         the hero word is engine-written (GET /write/word) and would otherwise
         wait a full network round trip after hydration — long enough for the
         hero's cold-start fallback to fire on slow connections. Landing route
         + production hostname only (mirrors the Plausible gate below), so deep
         links and dev builds don't fetch a payload they never use. URL and
         credentials mode mirror lib/api (apiFetch sends credentials, so the
         preload must too, or the browser refuses to match them up). -->
    <script>
      if (location.pathname === '/' && location.hostname === 'kurrentschrift.ink') {
        var hw = document.createElement('link');
        hw.rel = 'preload';
        hw.as = 'fetch';
        hw.crossOrigin = 'use-credentials';
        hw.href = 'https://api.kurrentschrift.ink/sources/suetterlin-1922/write/word?text=Kurrent%C5%BFchrift';
        document.head.appendChild(hw);
      }
    </script>

    <!-- Privacy-friendly analytics by Plausible (production only). The script
         and event endpoint are both proxied through a Cloudflare Worker on
         kurrentschrift.ink/{js/script.js,pa/event} so requests stay same-origin
         and aren't blocked by adblockers. Events go to /pa/event (not the
         conventional /api/event) because /api/* is gated by Cloudflare Access
         for the admin SPA. The hostname gate keeps dev/preview builds from
         polluting prod stats. -->
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      if (location.hostname === 'kurrentschrift.ink') {
        var s = document.createElement('script');
        s.async = true;
        s.src = '/js/script.js';
        document.head.appendChild(s);
        plausible.init({ endpoint: '/pa/event' });
      }
    </script>
